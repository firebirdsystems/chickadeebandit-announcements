<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements</title>
  <base href="/run/announcements/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --shadow-md:    0 4px 12px rgba(0,0,0,.1);
      --red:          var(--hub-tint-danger-fg, #dc2626);
      --red-light:    var(--hub-tint-danger, #fee2e2);
      --green:        var(--hub-tint-success-fg, #059669);
      --green-light:  var(--hub-tint-success, #d1fae5);
      --amber:        var(--hub-tint-warning-fg, #d97706);
      --amber-light:  var(--hub-tint-warning, #fef3c7);
      --blue:         #2563eb;
      --blue-light:   #dbeafe;
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; border: none;
      transition: opacity .15s, background .15s; text-decoration: none;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-xs { padding: 3px 8px; font-size: 0.75rem; border-radius: 6px; }

    /* Page header */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
    }
    .page-header h1 { font-size: 1.25rem; font-weight: 700; }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0;
    }
    .tab {
      padding: 8px 14px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: none; background: transparent;
      color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .15s, border-color .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; font-size: 0.7rem; font-weight: 700;
      background: var(--red); color: white; line-height: 1;
    }

    /* Announcement cards */
    .list { display: flex; flex-direction: column; gap: 10px; }

    .ann-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .ann-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-mid); }
    .ann-card-inner { padding: 14px 16px; }

    .ann-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 6px;
    }
    .ann-title { font-weight: 700; font-size: 1rem; line-height: 1.35; flex: 1; min-width: 0; }
    .ann-body {
      font-size: 0.875rem; color: var(--muted); margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ann-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 0.8rem; color: var(--muted);
    }
    .ann-meta-dot::before { content: "·"; margin-right: 10px; }
    .ann-actions {
      display: flex; gap: 6px; align-items: center;
      border-top: 1px solid var(--border); padding: 10px 16px;
    }
    .ann-actions-spacer { flex: 1; }

    /* Status badges */
    .status-badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
      white-space: nowrap;
    }
    .status-pending  { background: var(--amber-light);  color: var(--amber); }
    .status-approved { background: var(--green-light);  color: var(--green); }
    .status-archived { background: var(--bg);              color: var(--muted); }
    .status-critical { background: var(--red-light);    color: var(--red); }

    /* Critical toggle */
    .toggle-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--red-light); border: 1.5px solid #fca5a5;
      border-radius: 8px; cursor: pointer;
    }
    .toggle-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--red); }
    .toggle-row label { font-size: 0.875rem; font-weight: 600; color: var(--red); cursor: pointer; flex: 1; }
    .toggle-row .toggle-hint { font-size: 0.78rem; color: #b91c1c; }

    /* Acknowledge banner */
    .ack-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--red-light); border: 1.5px solid #fca5a5;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    }
    .ack-banner p { font-size: 0.85rem; font-weight: 600; color: var(--red); }
    .ack-done { font-size: 0.82rem; color: var(--green); font-weight: 600; }
    .ack-list { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }

    /* Moderator-not-configured notice */
    .mod-notice {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--amber-light); border: 1.5px solid #fcd34d;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    }
    .mod-notice p { font-size: 0.85rem; font-weight: 600; color: var(--amber); }
    .mod-notice.info { background: var(--card); border-color: var(--border); }
    .mod-notice.info p { color: var(--muted); font-weight: 500; }

    /* Empty state */
    .empty {
      text-align: center; padding: 48px 16px; color: var(--muted);
    }
    .empty-icon { margin-bottom: 12px; }
    .empty p { font-size: 0.9rem; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: var(--card); border-radius: calc(var(--radius) * 1.5);
      box-shadow: var(--shadow-md); width: 100%; max-width: 520px;
      max-height: calc(100vh - 32px); overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 0;
    }
    .modal-header h2 { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 1.25rem; line-height: 1; padding: 4px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 20px; }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 0 20px 18px;
    }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 600;
      margin-bottom: 5px; color: var(--text);
    }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.9rem; font-family: inherit; color: var(--text);
      background: var(--bg); transition: border-color .15s;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .form-hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    /* Detail body text */
    .detail-body {
      font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
      line-height: 1.6; color: var(--text); margin-bottom: 14px;
    }
    .detail-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    .detail-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 14px 0;
    }

    /* Transient status line — the only feedback for what the email send did. */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 8px;
      background: var(--text); color: var(--accent-fg); font-size: 0.85rem; line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 60; text-align: center;
    }
    .file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; margin: 2px 4px 2px 0; color: var(--text); text-decoration: none; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
<div class="app">
  <div class="page-header">
    <h1><span id="page-glyph"></span> Announcements</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost" id="settings-btn" data-testid="settings" style="display:none" aria-label="Moderator settings" onclick="openModSettingsModal()"></button>
      <button class="btn btn-primary" id="post-btn" data-testid="post-announcement" onclick="openSubmitModal()">Post Announcement</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="active"    data-testid="tab-active"   onclick="switchTab('active')">Active <span id="critical-badge" data-testid="critical-badge" class="badge" style="display:none;background:var(--red)"></span></button>
    <button class="tab"        data-tab="pending"   data-testid="tab-pending"  onclick="switchTab('pending')" id="pending-tab">
      Pending <span id="pending-badge" data-testid="pending-badge" class="badge" style="display:none"></span>
    </button>
    <button class="tab"        data-tab="archived"  data-testid="tab-archived" onclick="switchTab('archived')">Archived</button>
  </div>
  <div id="mod-notice" data-testid="mod-notice"></div>
  <div class="search-row" id="search-row" style="display:none">
    <input id="search" data-testid="search" class="search-input" type="search" placeholder="Search announcements…" aria-label="Search announcements" />
  </div>
  <div id="list" data-testid="list"></div>
</div>

<script type="module">
import {
  hubAlert, memberColor, initial, esc, isAdult, hubConfirm, formatRelativeDate, searchMatch, hubToday,
  createShareHelper, activeShareLinks, glyph, chickadee, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS,
  createFilesHelper,
} from "/hub-sdk.js";
import {
  defaultExpiry, isExpired, effectiveStatus, sortAnnouncements, formatExpiryDate, canModerate as _canModerate, searchableFields,
  canShareAnnouncement, supervisesAcknowledgements, outcomeUnknown, storedDiffers, SAVED_AS_FIRST, failureLine,
  audienceIds, notifyAudience, audienceLabel, audienceDraft, notAcknowledged, asksToAcknowledge, isFileId, MAX_ATTACHMENTS, uploadFailureLine, parseStrings,
  emailOutcomeLine,
} from "./logic.js";
import { createShareUi, createOverlayView } from "/hub-share-ui.js";

// The page heading and settings button are static markup; their marks come from the SDK.
document.getElementById("page-glyph").innerHTML = glyph("megaphone");
document.getElementById("settings-btn").innerHTML = glyph("gear");

const CONTEXT          = window.__CONTEXT_URL    ?? "";
const DB               = window.__DB_URL         ?? "";
const APP_ID           = window.__APP_ID         ?? "announcements";
const ME               = window.__CURRENT_MEMBER ?? null;
const EVENTS_URL       = window.__EVENTS_URL     ?? "/api/events";
const ADMIN_CONFIG_URL = window.__ADMIN_CONFIG_URL ?? "";
const FILES_URL        = window.__FILES_URL        ?? "";
const files            = createFilesHelper(FILES_URL);
const FILE_TYPES = ["application/pdf", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "text/plain",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document"];

// Where the app is running. Other members' acknowledgements are read by any
// adult in a household and by the steward alone in a shared space.
const TENANT = { tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true };
const READS_ACKS = supervisesAcknowledgements(ME, TENANT);

// Hub-level admin — used only for settings UI (configuring the moderator group).
const hubAdmin = ME?.isAdmin === true;

let members          = [];
let groups           = [];
let appMembers       = null;   // the members the hub admits to this app; null = unknown, use members
const attachmentsByAnn = new Map();
let modGroupId       = null;
let announcements    = [];
let acknowledgements = [];
let currentTab       = "active";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let modalEl          = null;

// Returns true if the current member may moderate announcements
// (approve, delete, direct-publish). Mirrors the server: the `approvals` table is
// `insert_privileged_only` keyed on the moderator group, and row policies CANNOT see
// hub-admin — so a hub admin who is not in the moderator group cannot actually
// approve. Gating on group membership only keeps the buttons honest (no silent 403).
// Hub admins configure the moderator group via the settings gear (hubAdmin, line ~901).
function canModerate() {
  return _canModerate(ME, groups, modGroupId);
}

// What the audience helpers resolve against: the admitted set for "who is
// told", the roster for names.
// A roster participant sees only the steward and themselves; nobody else
// sees a partial roster.
const COMPLETE_ROSTER = TENANT.spaceKind !== "roster" || TENANT.isAdmin;
const ctx = () => ({ groups, appMembers, members, complete: COMPLETE_ROSTER });

// External share links (manifest.shareable.announcement). The hub injects the
// URLs only when the manifest declares `shareable`, and mints for adults only;
// whether this household or space allows it at all is answered by the panel's
// first read, which it reports rather than guessing here.
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const CAN_SHARE = share.enabled && isAdult(ME);
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share,
  itemType: "announcement",
  noun: "announcement",
  scopeHtml: () => "The page shows the announcement’s title, its text and the day it was posted. Who wrote it, who approved it and who has acknowledged it stay here. Anyone who gets the link can read it.",
  esc,
  glyph,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks,
  expiryChoices: SHARE_EXPIRY_CHOICES,
  defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  getMe: () => ME,
  isAdmin: () => hubAdmin,
  memberName: (id) => members.find(m => m.id === id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

// ── DB helper ─────────────────────────────────────────────────────────────────

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  // The hub reports a refused write as a JSON body with an `error` key
  // (403 row policy, 400 bad statement, 507 over quota). fetch() does not
  // reject on those, so without this throw every caller's rollback and
  // error toast below is unreachable code.
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || `Database request failed (${res.status})`), { status: res.status, code: json?.code });
  return json;
}

/** Several statements as one transaction — all apply, or none does. */
async function dbBatch(statements) {
  if (!DB || statements.length === 0) return { results: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || `Database request failed (${res.status})`), { status: res.status, code: json?.code });
  return json;
}

// ── Members ───────────────────────────────────────────────────────────────────

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "admin" },
      { id: "demo-2", name: "Jamie", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
    ];
    return;
  }
  // A member list that could not be read is a failed load, not a household with
  // nobody in it: `canModerate` would answer false for everyone.
  const res  = await fetch(`${CONTEXT}?keys=family.members,family.groups,family.app_members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || typeof data !== "object" || data.error) throw new Error("Couldn’t reach the hub. Try again.");
  // A 200 can still name a key the hub failed to read; an absent key with no such entry is only "not permitted".
  if (Array.isArray(data.$errors) && ["family.members", "family.groups", "family.app_members"].some(k => data.$errors.includes(k))) throw new Error("Couldn’t reach the hub. Try again.");
  members    = data["family.members"] ?? [];
  groups     = data["family.groups"]  ?? [];
  appMembers = data["family.app_members"] ?? null;
}

async function loadSettings() {
  if (!DB) return;
  const { rows } = await db(
    `SELECT value FROM app_announcements__settings WHERE key = 'moderator_group_id'`
  );
  modGroupId = rows?.[0]?.value || null;
}

// ── Data loading ──────────────────────────────────────────────────────────────

async function loadAnnouncements() {
  // A bare local date, not an instant: `expires_at` is a bare "YYYY-MM-DD", and
  // comparing it to a timestamp is a lexical compare that loses the expiry day.
  const today = hubToday();
  const { rows } = await db(
    `SELECT
       a.id, a.title, a.body, a.author_id, a.author_name, a.expires_at,
       a.created_at, a.updated_at, a.is_critical, a.email_everyone, a.audience_kind, a.audience_group_id, a.audience_member_ids, a.approved_flag,
       COALESCE(apr.approved_by, a.approved_by) AS approved_by,
       COALESCE(apr.approved_at, a.approved_at) AS approved_at,
       CASE
         WHEN apr.announcement_id IS NOT NULL AND a.expires_at >= ? THEN 'approved'
         WHEN apr.announcement_id IS NOT NULL                        THEN 'archived'
         WHEN a.expires_at < ?                                       THEN 'archived'
         WHEN a.status = 'approved'                                 THEN 'pending'
         ELSE a.status
       END AS status
     FROM app_announcements__announcements a
     LEFT JOIN app_announcements__approvals apr ON apr.announcement_id = a.id
     ORDER BY a.created_at DESC`,
    [today, today]
  );
  announcements = rows ?? [];
}

async function loadAcknowledgements() {
  if (!ME?.id || !DB) return;
  const { rows } = await db(
    `SELECT announcement_id, acknowledged_at FROM app_announcements__acknowledgements WHERE member_id = ?`,
    [ME.id]
  );
  acknowledgements = rows ?? [];
}

async function loadAttachments(announcementId) {
  if (!DB) { attachmentsByAnn.set(announcementId, attachmentsByAnn.get(announcementId) ?? []); return attachmentsByAnn.get(announcementId); }
  const { rows } = await db(
    `SELECT id, file_id, file_name, created_at FROM app_announcements__attachments WHERE announcement_id = ? ORDER BY created_at ASC`,
    [announcementId]
  );
  const list = (rows ?? []).filter(r => isFileId(r.file_id));
  attachmentsByAnn.set(announcementId, list);
  return list;
}

function hasAcknowledged(announcementId) {
  return acknowledgements.some(a => a.announcement_id === announcementId);
}

// ── Render ────────────────────────────────────────────────────────────────────

function memberName(id) {
  return members.find(m => m.id === id)?.name ?? "Unknown";
}

function statusBadge(status) {
  const labels = { pending: "Pending", approved: "Active", archived: "Archived" };
  return `<span class="status-badge status-${esc(status)}" data-testid="status-badge" data-status="${esc(status)}">${labels[status] ?? esc(status)}</span>`;
}

function filteredList() {
  const scoped = scopedList();
  return searchQ ? scoped.filter(a => searchMatch(searchQ, searchableFields(a))) : scoped;
}

function scopedList() {
  if (currentTab === "active") {
    return sortAnnouncements(announcements.filter(a => a.status === "approved"));
  }
  if (currentTab === "pending") {
    const list = announcements.filter(a => a.status === "pending");
    return sortAnnouncements(canModerate() ? list : list.filter(a => a.author_id === ME?.id));
  }
  if (currentTab === "archived") {
    return sortAnnouncements(announcements.filter(a => a.status === "archived"));
  }
  return [];
}

// Surfaces the dead-end state where a household has pending announcements but no
// moderator group is configured, so nobody (not even hub admins) can approve them.
// Hub admins get an actionable prompt to the settings modal; everyone else gets a
// quiet "waiting on an admin" note so a stuck queue doesn't read as broken.
function renderModNotice(pendingCount) {
  const el = document.getElementById("mod-notice");
  if (!el) return;

  // Three ways the queue can be stuck, not one. A group id that points at a
  // deleted group, or at a group whose roster has been emptied, leaves nobody
  // privileged — exactly the dead end as an unset id — but the app used to see
  // a configured id and say nothing at all, so pending announcements simply
  // never moved and no screen explained why.
  const group = modGroupId ? groups.find(g => g.id === modGroupId) : null;
  const problem = !modGroupId ? "unset"
    : !group ? "missing"
    : (group.memberIds ?? []).length === 0 ? "empty"
    : null;
  if (!problem || pendingCount === 0) {
    el.innerHTML = "";
    return;
  }

  const cause = {
    unset:   "No moderator group is set",
    missing: "The moderator group has been deleted",
    empty:   `The moderator group (${esc(group?.name ?? "")}) has no members`,
  }[problem];

  if (hubAdmin) {
    el.innerHTML = `
      <div class="mod-notice">
        <p>${cause}, so announcements can't be approved. ${problem === "empty"
          ? "Add members to it in hub settings, or choose a different group."
          : "Choose one to enable approvals."}</p>
        <button class="btn btn-primary btn-sm" onclick="openModSettingsModal()">${problem === "unset" ? "Set moderator group" : "Change moderator group"}</button>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="mod-notice info">
        <p>Waiting on an admin to set up announcement approvals.</p>
      </div>`;
  }
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  render();  // render() only rewrites #list, so the search box keeps focus
});

let loadFailed = false;

function render() {
  // Update pending badge
  const pendingCount = announcements.filter(a => a.status === "pending").length;
  renderModNotice(pendingCount);
  const ownPending   = announcements.filter(a => a.status === "pending" && a.author_id === ME?.id).length;
  const badgeCount   = canModerate() ? pendingCount : ownPending;
  const badge  = document.getElementById("pending-badge");
  if (badge) {
    badge.textContent = badgeCount;
    badge.style.display = badgeCount > 0 ? "" : "none";
  }

  // Update unacknowledged critical badge on Active tab
  const unackCritical = announcements.filter(a =>
    a.status === "approved" && asksToAcknowledge(a, ME?.id, ctx()) && !hasAcknowledged(a.id)
  ).length;
  const critBadge = document.getElementById("critical-badge");
  if (critBadge) {
    critBadge.textContent = unackCritical;
    critBadge.style.display = unackCritical > 0 ? "" : "none";
  }

  // Highlight pending tab for moderators when there are items
  const pendingTab = document.getElementById("pending-tab");
  if (pendingTab && canModerate() && pendingCount > 0) {
    pendingTab.style.color = currentTab !== "pending" ? "var(--amber)" : "";
  }

  // The box is only worth showing once this tab has something to search.
  const searchRow = document.getElementById("search-row");
  if (searchRow) searchRow.style.display = scopedList().length ? "" : "none";

  const items = filteredList();
  const listEl = document.getElementById("list");
  if (!listEl) return;

  // Until the first load succeeds, "No active announcements." would be a guess.
  if (loadFailed) {
    listEl.innerHTML = `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load announcements.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }

  if (items.length === 0) {
    if (searchQ) {
      listEl.innerHTML = `<div class="empty" data-testid="empty-state"><div class="empty-icon">${chickadee("searching")}</div><p>Nothing matches "${esc(searchQ)}".</p></div>`;
      return;
    }
    const msgs = {
      active:   { pose: "nest", text: "No active announcements." },
      pending:  { pose: "sleeping", text: canModerate() ? "No pending announcements." : "You have no pending submissions." },
      archived: { pose: "nest", text: "No archived announcements." },
    };
    const { pose, text } = msgs[currentTab];
    listEl.innerHTML = `<div class="empty" data-testid="empty-state"><div class="empty-icon">${chickadee(pose)}</div><p>${text}</p></div>`;
    return;
  }

  listEl.innerHTML = `<div class="list">${items.map(ann => renderCard(ann)).join("")}</div>`;
}

function renderCard(ann) {
  // The household's day, not the device's. `expires_at` is a bare "YYYY-MM-DD"
  // chosen against the household calendar and expiry is INCLUSIVE of that day,
  // so a device-local default would archive a live announcement several hours
  // early for a member who is east of the household — or keep an expired one on
  // screen for one who is west. logic.js keeps its own default so it stays pure
  // and Node-testable; the household day is supplied here.
  const effStatus = effectiveStatus(ann, hubToday());
  const expired   = isExpired(ann.expires_at, hubToday());
  const expiryLabel = effStatus === "archived" || expired
    ? `Expired ${formatExpiryDate(ann.expires_at)}`
    : `Expires ${formatExpiryDate(ann.expires_at)}`;

  const isCritical = !!ann.is_critical;
  const acked = isCritical && hasAcknowledged(ann.id);
  const needsAck = asksToAcknowledge(ann, ME?.id, ctx()) && !acked && effStatus === "approved";

  const criticalBadge = isCritical
    ? `<span class="status-badge status-critical" style="margin-left:6px">${glyph("siren", { accent: "currentColor" })} Critical</span>`
    : "";

  const ackIndicator = needsAck
    ? `<span data-testid="ack-indicator" data-acked="0" style="font-size:0.75rem;color:var(--red);font-weight:600;margin-left:auto">Requires acknowledgement</span>`
    : (acked ? `<span data-testid="ack-indicator" data-acked="1" style="font-size:0.75rem;color:var(--green);font-weight:600;margin-left:auto">${glyph("tick")} Acknowledged</span>` : "");

  const cardBorder = needsAck ? `style="border-color:#fca5a5;border-width:2px"` : "";

  const moderator = canModerate();
  const shareable = CAN_SHARE && canShareAnnouncement(ann);
  const adminActions = moderator || shareable ? `
    <div class="ann-actions">
      ${moderator && ann.status === "pending" ? `<button class="btn btn-success btn-xs" data-testid="approve" data-action="approve" data-id="${esc(ann.id)}">Approve</button>` : ""}
      ${shareable ? `<button class="btn btn-ghost btn-xs" data-testid="announcement-share" data-action="share" data-id="${esc(ann.id)}">Share</button>` : ""}
      <span class="ann-actions-spacer"></span>
      ${moderator ? `<button class="btn btn-danger btn-xs" data-testid="delete" data-action="delete" data-id="${esc(ann.id)}">Delete</button>` : ""}
    </div>` : "";

  return `
    <div class="ann-card" data-testid="ann-card" data-announcement-id="${esc(ann.id)}" data-status="${esc(effStatus)}" data-action="open" data-id="${esc(ann.id)}" ${cardBorder}>
      <div class="ann-card-inner">
        <div class="ann-header">
          <div class="ann-title" data-testid="ann-title">${esc(ann.title)}</div>
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
            ${criticalBadge}
            ${statusBadge(effStatus)}
          </div>
        </div>
        <div class="ann-body" data-testid="ann-body">${esc(ann.body)}</div>
        <div class="ann-meta" data-testid="ann-meta">
          <span>By ${esc(ann.author_name)}</span>
          ${(ann.audience_kind ?? "everyone") !== "everyone" ? `<span class="ann-meta-dot" data-testid="ann-audience">To ${esc(audienceLabel(ann, ctx()))}</span>` : ""}
          <span class="ann-meta-dot">${expiryLabel}</span>
          <span class="ann-meta-dot">${formatRelativeDate(ann.created_at)}</span>
          ${ackIndicator}
        </div>
      </div>
      ${adminActions}
    </div>`;
}

// ── Modal ─────────────────────────────────────────────────────────────────────

// `testid` names the dialog — submit, detail and moderator settings are all
// `.modal`, so a scenario has to be able to wait on the one it just opened.
function openModal(html, testid) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal"${testid ? ` data-testid="${testid}"` : ""}>${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}

// Files uploaded into the open compose dialog, as { id, name } with the name
// the hub stored (a HEIC may be kept as a JPEG). They belong to that dialog
// alone: `pendingHost` is the modal they were uploaded into.
let pendingUploads = [];
let pendingHost = null;
// The compose dialog whose post is in flight. While set, the dialog cannot be
// closed, no upload can be added or removed, and an upload that finishes is
// deleted: the post took its list of files when it started.
let postingHost = null;

function dropPending({ deleteFiles }) {
  if (deleteFiles) for (const { id } of pendingUploads) files.delete(id).catch(() => {});
  pendingUploads = [];
  pendingHost = null;
}

function closeModal() {
  // A compose dialog closed without posting leaves uploads no row names;
  // delete them now rather than leaving them in storage until the
  // household's sweep. A post that reached the hub clears the list first.
  if (modalEl && modalEl === postingHost) return;
  if (modalEl && modalEl === pendingHost) dropPending({ deleteFiles: true });
  modalEl?.remove();
  modalEl = null;
}

// ── Submit modal ──────────────────────────────────────────────────────────────

function openSubmitModal() {

  // buttons use inline handlers, past the delegated guard below).
  if (postingHost) return;
  // Seeded from the household's day: this value is STORED as expires_at, and
  // the field's own `min` below is already hubToday().
  const expiry = defaultExpiry(new Date(`${hubToday()}T12:00:00`));
  const label  = canModerate() ? "Create Announcement" : "Post Announcement";

        <p class="form-hint">Up to ${MAX_ATTACHMENTS} files: PDF, image, Word or text. Attachments are shown in the app, not on a share link.</p>
      </div>
      <div class="form-group">

    modalEl.querySelector("#f-members-row").style.display = e.target.value === "members" ? "" : "none";

// Uploads happen before the announcement exists, so the ids ride on the modal
// until Save writes the rows. A file removed before that is deleted at once:
// no row names it yet, so nothing else ever would.
async function uploadAttachment(input) {
  const host = modalEl;
  const file = input.files?.[0];
  if (!host || !file || host !== pendingHost || host === postingHost) { input.value = ""; return; }
  const errEl = host.querySelector("#f-file-error") ?? Object.assign(document.createElement("p"), { id: "f-file-error", className: "form-hint", style: "color:var(--red)" });
  host.querySelector("#f-file-list")?.after(errEl);
  if (pendingUploads.length >= MAX_ATTACHMENTS) { errEl.textContent = `Attach at most ${MAX_ATTACHMENTS} files.`; input.value = ""; return; }
  input.disabled = true;
  // Counted on the dialog, so Post can wait rather than post without a file
  // the author is still sending.
  host.dataset.uploading = String((Number(host.dataset.uploading) || 0) + 1);
  try {
    const reply = await files.upload(file);
    // The dialog was closed while the file was on its way: nothing will
    // name it, so it goes now.
    if (pendingHost !== host || postingHost === host) {
      files.delete(reply.id).catch(() => {});
      return;
    }
    pendingUploads.push({ id: reply.id, name: String(reply.name || file.name).slice(0, 120) });
    errEl.textContent = "";
    renderAttachmentChips(host);
  } catch (e) {
    console.error(e);
    errEl.textContent = uploadFailureLine(e);
  } finally {
    const left = (Number(host.dataset.uploading) || 1) - 1;
    if (left > 0) host.dataset.uploading = String(left); else delete host.dataset.uploading;
    input.disabled = false;
    input.value = "";
  }
}

function renderAttachmentChips(host) {
  const list = host.querySelector("#f-file-list");
  if (list) list.innerHTML = pendingUploads.map(({ id, name }) => `<span class="file-chip" data-testid="attachment-chip">${glyph("paperclip")} ${esc(name || "file")} <button type="button" class="btn btn-xs btn-ghost" data-action="drop-upload" data-id="${esc(id)}" aria-label="Remove">×</button></span>`).join("");
}

// A file removed before posting is deleted at once: no row names it yet, so
// nothing else ever would.
async function dropUpload(id) {
  const host = modalEl;
  if (!host || host !== pendingHost || host === postingHost) return;
  const before = pendingUploads.length;
  pendingUploads = pendingUploads.filter(u => u.id !== id);
  if (pendingUploads.length === before) return;
  renderAttachmentChips(host);
  files.delete(id).catch(() => {});
}

window.closeModal = closeModal;

window.submitAnn = async function() {
  const title      = document.getElementById("f-title")?.value.trim() ?? "";
  const body       = document.getElementById("f-body")?.value.trim() ?? "";
  const expires    = document.getElementById("f-expires")?.value ?? "";
  const isCritical = document.getElementById("f-critical")?.checked ? 1 : 0;
  const emailAll   = document.getElementById("f-email")?.checked ? 1 : 0;

  if (!title) { document.getElementById("f-title")?.focus(); return; }
  if (!body)  { document.getElementById("f-body")?.focus(); return; }
  if (!expires) return;

  const host = modalEl;
  if (host?.dataset.uploading) { hubAlert("Wait for the attachment to finish uploading, then post."); return; }
  const audience = audienceDraft({
    kind: host?.querySelector("#f-audience")?.value,
    groupId: host?.querySelector("#f-group")?.value,
    memberIds: [...(host?.querySelectorAll("[data-member]:checked") ?? [])].map(el => el.dataset.member),
  });
  if (audience.error) { hubAlert(audience.error); return; }
  const aud = audience.value;
  const uploads = host && host === pendingHost ? pendingUploads.filter(u => isFileId(u.id)) : [];
  const btn = host?.querySelector(".modal-actions .btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  // Locked until the post settles: see postingHost.
  postingHost = host;
  const fileInput = host?.querySelector("#f-files");
  if (fileInput) fileInput.disabled = true;
  host?.querySelectorAll('[data-action="drop-upload"], [data-testid="submit-cancel"], .modal-close').forEach(el => { el.disabled = true; });
  const unlock = () => {
    if (postingHost === host) postingHost = null;
    if (fileInput) fileInput.disabled = false;
    host?.querySelectorAll('[data-action="drop-upload"], [data-testid="submit-cancel"], .modal-close').forEach(el => { el.disabled = false; });
  };

  // The id is the form's, minted on its first Save and sent on every retry: a
  // try whose answer was lost may have stored the announcement, and a second
  // press must find it rather than post (and push, and email) it again.
  const id         = host ? (host.dataset.rowId ||= crypto.randomUUID()) : crypto.randomUUID();
  const now        = new Date().toISOString();
  const mod        = canModerate();
  const authorId   = ME?.id   ?? "demo";
  const authorName = ME?.name ?? "You";
  const typed      = { title, body, expires_at: expires, is_critical: isCritical, email_everyone: emailAll, ...aud };
  let posted = { title, body, emailAll, ...aud };
  let note = "";

  try {
    // A moderator's own approval goes in the same batch: both are stored, or
    // neither, so a found announcement is never one left pending by accident.
    const statements = [{
      sql: `INSERT INTO app_announcements__announcements (id, title, body, status, author_id, author_name, expires_at, created_at, updated_at, is_critical, email_everyone, audience_kind, audience_group_id, audience_member_ids)
       VALUES (?, ?, ?, 'pending', ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      params: [id, title, body, authorId, authorName, expires, now, now, isCritical, emailAll, aud.audience_kind, aud.audience_group_id, aud.audience_member_ids],
    }];
    if (mod) {
      statements.push({
        sql: `INSERT INTO app_announcements__approvals (announcement_id, approved_by, approved_at) VALUES (?, ?, ?)`,
        params: [id, authorId, now],
      });
    }
    try {
      await dbBatch(statements);
    } catch (e) {
      // Unknown outcome: read the announcement back by the pinned id. Found
      // means an earlier try landed and its success path never ran, so it runs
      // now, once. Not found, or the read failed: the post fails, the id stays pinned.
      if (!outcomeUnknown(e)) throw e;
      let stored = null;
      try {
        stored = (await db(
          `SELECT title, body, expires_at, is_critical, email_everyone, audience_kind, audience_group_id, audience_member_ids FROM app_announcements__announcements WHERE id = ?`, [id]
        )).rows?.[0] ?? null;
      } catch (readErr) {
        // The id is ours: with the read-back failed, a UNIQUE answer may be this
        // form's own first try, so nothing is known — "try again", not "already exists".
        console.error(readErr);
        throw new Error("create outcome unknown", { cause: e });
      }
      if (!stored) throw e;
      console.error(e);
      // Edited since that first try: what was stored is kept, and said so.
      if (storedDiffers(stored, typed)) note = SAVED_AS_FIRST;
      posted = { title: stored.title, body: stored.body, emailAll: Number(stored.email_everyone) ? 1 : 0, audience_kind: stored.audience_kind, audience_group_id: stored.audience_group_id, audience_member_ids: stored.audience_member_ids };
    }
  } catch (e) {
    unlock();
    if (btn) { btn.disabled = false; btn.textContent = canModerate() ? "Create Announcement" : "Post Announcement"; }
    console.error(e);
    hubAlert(failureLine(e, { action: "post the announcement", thing: "announcement" }));
    return;
  }
  if (host) delete host.dataset.rowId;

  // Stored. The attachments follow in their own request: an attachment row is
  // admitted only against an announcement that exists. If the hub definitely
  // refused them, the uploads are deleted with the dialog. If the answer was
  // lost (the rows may have landed), they are left in storage: deleting a
  // file a stored row names would break it for good, while an unnamed one is
  // reclaimed by the household's sweep.
  if (uploads.length) {
    try {
      // One multi-row INSERT, not a batch: the table is capped per announcement
      // (max_per_member), and the hub takes a single INSERT into a capped
      // table per request, counting every row it carries against the cap.
      await db(
        `INSERT INTO app_announcements__attachments (id, announcement_id, file_id, file_name, uploaded_by, created_at) VALUES `
          + uploads.map(() => "(?, ?, ?, ?, ?, ?)").join(", "),
        uploads.flatMap(({ id: fid, name }) => [crypto.randomUUID(), id, fid, name, authorId, now]),
      );
      dropPending({ deleteFiles: false });
    } catch (e) {
      console.error(e);
      if (outcomeUnknown(e)) dropPending({ deleteFiles: false });
      note = note ? `${note} The attachments could not be added.` : "Announcement posted, but the attachments could not be added.";
    }
  }
  // Nothing below can make the post look failed: a reload that fails
  // falls back to what was written (a moderator's post is approved with it).
  let isApproved = !!mod;
  try {
    await loadAnnouncements();
    isApproved = announcements.find(a => a.id === id)?.status === "approved";
  } catch (e) { console.error(e); }

  // Decided once, so the push, the email and the household conversation can
  // never disagree about who this is for.
  const postedAudience = notifyAudience(posted, ctx());
  try {
    await Promise.all([
      isApproved
        ? publishEvent("announcement.approved", id, { title: posted.title, authorId })
        : publishEvent("announcement.submitted", id, { title: posted.title, authorId }),
      isApproved ? notify(`📢 New Announcement: ${posted.title}`, posted.body.slice(0, 100), posted.emailAll ? posted.body : null, postedAudience, "posted", posted.audience_kind) : Promise.resolve(),
      // The household conversation reaches everyone, so it carries only an
      // announcement meant for everyone; a segmented one is told by push.
      isApproved && postedAudience === "all" ? fetch("/api/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          authorName: "Announcements",
          body: `📢 ${authorName} posted a new announcement: "${posted.title.slice(0, 60)}"`,
          url: `/run/${APP_ID}?announcementId=${id}`,
        }),
      }).catch(() => {}) : Promise.resolve(),
      // The activity feed reaches every member too: same rule as the conversation.
      isApproved && postedAudience === "all" ? fetch(window.__ACTIVITY_URL ?? "/api/activity", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: "conversation_message_posted",
          actor: authorName,
          description: `${authorName} posted a new announcement: "${posted.title.slice(0, 60)}"`,
          metadata: { deepLink: { appId: APP_ID, params: { announcementId: id } } },
        }),
      }).catch(() => {}) : Promise.resolve(),
    ]);
  } catch (e) { console.error(e); }

  // Held until here: until the dialog closes, nothing may be attached to a
  // post that has already taken its list of files.
  unlock();
  if (modalEl === host) closeModal();
  switchTab(isApproved ? "active" : "pending");
  render();
  if (note) hubAlert(note);
};

// ── Detail modal ──────────────────────────────────────────────────────────────

// The detail dialog's attachments: loading, failed, the links, or nothing.
function attachmentsHtml(id) {
  const attachments = attachmentsByAnn.get(id);
  if (attachments === undefined) return `<p class="detail-meta" data-testid="attachments">Loading attachments…</p>`;
  if (attachments === null) return `<p class="detail-meta" data-testid="attachments">Couldn’t load the attachments. Reopen this announcement to try again.</p>`;
  if (!attachments.length) return "";
  return `<div data-testid="attachments" style="margin-bottom:10px">${attachments.map(a => `<a class="file-chip" data-testid="attachment" href="${esc(files.url(a.file_id))}" target="_blank" rel="noopener">${glyph("paperclip")} ${esc(a.file_name || "file")}</a>`).join(" ")}</div>`;
}

window.openDetail = function(id) {
  // A post in flight owns the screen, whichever control asked (the header
  // buttons use inline handlers, past the delegated guard below).
  if (postingHost) return;
  const ann = announcements.find(a => a.id === id);
  if (!ann) return;
  const effStatus   = effectiveStatus(ann, hubToday());
  const expired     = isExpired(ann.expires_at, hubToday());
  const expiryLabel = expired
    ? `Expired ${formatExpiryDate(ann.expires_at)}`
    : `Expires ${formatExpiryDate(ann.expires_at)}`;

  const approvedLine = ann.approved_by
    ? `<p class="detail-meta">Approved by ${esc(memberName(ann.approved_by))} · ${formatRelativeDate(ann.approved_at)}</p>`
    : "";
  const audienceLine = (ann.audience_kind ?? "everyone") !== "everyone"
    ? `<p class="detail-meta" data-testid="detail-audience">Sent to ${esc(audienceLabel(ann, ctx()))}</p>`
    : "";
  const attachmentSection = `<div data-attachments-slot>${attachmentsHtml(id)}</div>`;
  if (attachmentsByAnn.get(id) === undefined) {
    // Only the slot is re-drawn, and only while THIS announcement's detail is
    // still the open dialog: re-opening it would drop an expanded
    // acknowledgement list or a button mid-request. A failed read says so
    // once and is then forgotten, so the next open asks again rather than
    // showing "no attachments" for the session.
    loadAttachments(id)
      .catch((e) => { console.error(e); attachmentsByAnn.set(id, null); })
      .then(() => {
        const slot = modalEl?.dataset.annId === id ? modalEl.querySelector("[data-attachments-slot]") : null;
        if (slot) slot.innerHTML = attachmentsHtml(id);
        if (attachmentsByAnn.get(id) === null) attachmentsByAnn.delete(id);
      });
  }

  const isCritical = !!ann.is_critical;
  const acked = isCritical && hasAcknowledged(ann.id);
  const ackedAt = isCritical && acked
    ? acknowledgements.find(a => a.announcement_id === id)?.acknowledged_at
    : null;

  let criticalSection = "";
  if (isCritical && effStatus === "approved" && (acked || asksToAcknowledge(ann, ME?.id, ctx()))) {
    if (acked) {
      criticalSection = `
        <div class="ack-banner" data-testid="ack-banner" data-acked="1" style="background:var(--green-light);border-color:#6ee7b7">
          <p style="color:var(--green)">${glyph("tick")} You acknowledged this announcement</p>
          <span class="ack-done">${ackedAt ? formatRelativeDate(ackedAt) : ""}</span>
        </div>`;
    } else {
      criticalSection = `
        <div class="ack-banner" data-testid="ack-banner" data-acked="0">
          <p>${glyph("siren")} This is a critical announcement. Please acknowledge that you have read it.</p>
          <button class="btn btn-danger btn-sm" data-testid="acknowledge" data-action="ack" data-id="${esc(id)}">Acknowledge</button>
        </div>`;
    }
  } else if (isCritical) {
    criticalSection = `<span class="status-badge status-critical" style="margin-bottom:10px;display:inline-flex">${glyph("siren", { accent: "currentColor" })} Critical</span>`;
  }

  const adminAckSection = (READS_ACKS && isCritical && effStatus === "approved")
    ? `<div style="margin-top:10px"><button class="btn btn-ghost btn-xs" data-testid="view-acknowledgements" data-action="acklist" data-id="${esc(id)}">View acknowledgements</button><div id="ack-list-${esc(id)}" data-testid="ack-list" class="ack-list"></div></div>`
    : "";

  const adminButtons = canModerate() ? `
    <hr class="detail-divider"/>
    ${adminAckSection}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:${adminAckSection ? '10px' : '0'}">
      ${ann.status === "pending" ? `<button class="btn btn-success btn-sm" data-testid="approve" data-action="approve" data-id="${esc(id)}">Approve</button>` : ""}
      <button class="btn btn-danger btn-sm" data-testid="delete" data-action="delete" data-id="${esc(id)}">Delete</button>
    </div>` : "";

  openModal(`
    <div class="modal-header">
      <h2 style="flex:1;min-width:0;padding-right:8px" data-testid="detail-title">${esc(ann.title)}</h2>
      <button class="modal-close" data-testid="detail-close" aria-label="Close" onclick="closeModal()">${glyph("close", { accent: "currentColor" })}</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:10px">${statusBadge(effStatus)}</div>
      <p class="detail-meta">By ${esc(ann.author_name)} · ${formatRelativeDate(ann.created_at)}</p>
      <p class="detail-meta">${expiryLabel}</p>
      ${audienceLine}
      ${approvedLine}
      <hr class="detail-divider"/>
      ${criticalSection}
      <p class="detail-body" data-testid="detail-body">${esc(ann.body)}</p>
      ${attachmentSection}
      ${adminButtons}
    </div>`, "detail-modal");
  modalEl.dataset.annId = id;
};

// ── Acknowledge ───────────────────────────────────────────────────────────────

window.acknowledgeAnn = async function(id) {
  if (!ME?.id || hasAcknowledged(id)) return;
  const btn = modalEl?.querySelector(".ack-banner .btn-danger");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

  const now = new Date().toISOString();
  let writeErr = null;
  try {
    await db(
      `INSERT OR IGNORE INTO app_announcements__acknowledgements (announcement_id, member_id, acknowledged_at) VALUES (?, ?, ?)`,
      [id, ME.id, now]
    );
  } catch (e) {
    // A concurrent duplicate acknowledgement (max_per_member) — reload and move on.
    writeErr = e;
    console.error(e);
  }
  const reloaded = await loadAcknowledgements().then(() => true, (e) => { console.error(e); return false; });
  closeModal();
  render();
  window.openDetail(id);
  // Not stored: a refusal by its status; a write that answered but stored
  // nothing was narrowed away (permission); a failed re-read is unknown.
  if (!hasAcknowledged(id)) {
    hubAlert(failureLine(writeErr, { action: "acknowledge the announcement", thing: "acknowledgement", found: !reloaded ? null : writeErr ? undefined : true }));
  }
};

window.loadAckList = async function(announcementId) {
  const el = document.getElementById(`ack-list-${announcementId}`);
  if (!el) return;
  el.textContent = "Loading…";
  let rows;
  try {
    ({ rows } = await db(
      `SELECT member_id, acknowledged_at FROM app_announcements__acknowledgements WHERE announcement_id = ? ORDER BY acknowledged_at ASC`,
      [announcementId]
    ));
  } catch {
    el.textContent = "Couldn’t load acknowledgements. Try again.";
    return;
  }
  const ann = announcements.find(a => a.id === announcementId);
  const pending = ann ? notAcknowledged(ann, rows ?? [], ctx()) : [];
  const nobody = ann ? audienceIds(ann, ctx()).length === 0 : false;
  const acked = (rows ?? []).map(r => `<div data-testid="ack-row">${esc(memberName(r.member_id))} — ${formatRelativeDate(r.acknowledged_at)}</div>`).join("");
  const waiting = nobody
    ? `<div style="margin-top:6px" data-testid="ack-pending">Nobody in its audience can be found, so there is nobody to wait for.</div>`
    : pending.length
      ? `<div style="margin-top:6px" data-testid="ack-pending">Not yet: ${pending.map(id => esc(memberName(id))).join(", ")}</div>`
      : (ann ? `<div style="margin-top:6px" data-testid="ack-pending">Everyone it was sent to has acknowledged.</div>` : "");
  el.innerHTML = (acked || "No acknowledgements yet.") + waiting;
};

// ── Approve ───────────────────────────────────────────────────────────────────

window.approveAnn = async function(id) {
  if (!canModerate()) return;
  const ann = announcements.find(a => a.id === id);
  if (!ann) return;

  const btn = document.activeElement;
  if (btn instanceof HTMLButtonElement) { btn.disabled = true; btn.textContent = "Approving…"; }

  let changed;
  try {
    const now = new Date().toISOString();
    // `announcement_id` is the approvals primary key, so of two moderators
    // approving together exactly one INSERT creates the row, and only that
    // moderator announces it: two would mean two notifications, two inbox
    // messages and two charges against the household's daily email quota.
    // A plain INSERT, because the table's write effect (which marks the
    // announcement approved) cannot run under OR IGNORE: the loser gets a
    // UNIQUE refusal, read below as "already approved". Matched on the
    // message: the hub sends no error code for a transaction that carried
    // write effects. The effect is a primary-key UPDATE that cannot raise
    // UNIQUE itself, so the only UNIQUE here is the approval's own key.
    ({ changed } = await db(
      `INSERT INTO app_announcements__approvals (announcement_id, approved_by, approved_at) VALUES (?, ?, ?)`,
      [id, ME?.id ?? "system", now]
    ));
  } catch (e) {
    if (e?.code === "UNIQUE_CONSTRAINT" || /UNIQUE constraint failed/i.test(String(e?.message ?? ""))) { changed = 0; }
    else {
      if (btn instanceof HTMLButtonElement) { btn.disabled = false; btn.textContent = "Approve"; }
      console.error(e);
      hubAlert(failureLine(e, { action: "approve the announcement", thing: "announcement" }));
      return;
    }
  }

  // The approval is stored from here on: a failed reload or fan-out is logged,
  // never reported as a failed approval.
  try {
    if (!changed) {
      await loadAnnouncements();
      closeModal();
      switchTab("active");
      render();
      return;
    }

    const annAudience = notifyAudience(ann, ctx());
    await Promise.all([
      loadAnnouncements(),
      publishEvent("announcement.approved", id, { title: ann.title, authorId: ann.author_id }),
      notify(`📢 New Announcement: ${ann.title}`, ann.body.slice(0, 100), ann.email_everyone ? ann.body : null, annAudience, "approved", ann.audience_kind),
      annAudience === "all" ? fetch("/api/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          authorName: "Announcements",
          body: `📢 ${ann.author_name} posted a new announcement: "${ann.title.slice(0, 60)}"`,
          url: `/run/${APP_ID}?announcementId=${id}`,
        }),
      }).catch(() => {}) : Promise.resolve(),
      annAudience === "all" ? fetch(window.__ACTIVITY_URL ?? "/api/activity", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: "conversation_message_posted",
          actor: ME?.name ?? "Admin",
          description: `${ann.author_name} posted a new announcement: "${ann.title.slice(0, 60)}"`,
          metadata: { deepLink: { appId: APP_ID, params: { announcementId: id } } },
        }),
      }).catch(() => {}) : Promise.resolve(),
    ]);
  } catch (e) {
    console.error(e);
  }
  closeModal();
  switchTab("active");
  render();
};

// ── Delete ────────────────────────────────────────────────────────────────────

window.deleteAnn = async function(id) {
  if (!canModerate()) return;
  const ann = announcements.find(a => a.id === id);
  if (!ann) return;

  const confirmed = await hubConfirm({
    message: "Delete this announcement?",
    description: `"${ann.title}" will be permanently removed.`,
    confirmLabel: "Delete",
    destructive: true,
  });
  if (!confirmed) return;

  // One statement: the manifest's delete_cascades remove the approval, the
  // acknowledgements and the attachments (reclaiming their files) as trusted
  // engine statements in the same transaction. The hub refuses this DELETE
  // inside a batch for that reason, so it is never sent as one.
  let result;
  try {
    result = await db(`DELETE FROM app_announcements__announcements WHERE id = ?`, [id]);
  } catch (e) {
    console.error(e);
    hubAlert(failureLine(e, { action: "delete the announcement", thing: "announcement" }));
    return;
  }
  // The delete committed: a failed reload is logged, not reported as a failed delete.
  let reloaded = true;
  try {
    await loadAnnouncements();
  } catch (e) {
    console.error(e);
    reloaded = false;
    if (Number(result?.changed ?? 0) > 0) announcements = announcements.filter(a => a.id !== id);
  }
  attachmentsByAnn.delete(id);
  closeModal();
  render();
  // The hub answers 200 with nothing changed when the caller may not delete
  // this row; the re-read above still shows it, so say why.
  if (reloaded && Number(result?.changed ?? 0) === 0 && announcements.some(a => a.id === id)) {
    hubAlert(failureLine(null, { action: "delete the announcement", thing: "announcement", found: true }));
  }
};

// ── Moderator settings (hub admin only) ───────────────────────────────────────

window.openModSettingsModal = function() {

      <button class="btn btn-primary" data-testid="mod-settings-save" onclick="saveModSettings()">Save</button>
    </div>`, "mod-settings-modal");
};

window.saveModSettings = async function() {
  const groupId = document.getElementById("mod-group")?.value ?? "";
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const res = await fetch(ADMIN_CONFIG_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: "moderator_group_id", value: groupId }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error(err?.error ?? "Save failed"), { status: res.status, code: typeof err?.code === "string" ? err.code : undefined });
    }
    modGroupId = groupId || null;
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    console.error(e);
    hubAlert(failureLine(e, { action: "save the settings", thing: "setting" }));
  }
};

// ── Tabs ──────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tab);
    if (t.dataset.tab !== "pending") t.style.color = "";
  });
  render();
}

window.switchTab = switchTab;
window.openSubmitModal = openSubmitModal;

// Delegated handler for id-bearing actions. Using data-* attributes + this
// listener (instead of inline onclick="fn('${id}')") is required because row
// ids are attacker-controllable via raw /api/db and esc() does NOT escape the
// single quotes an inline handler would break out of — a stored-XSS vector.
document.addEventListener("click", (e) => {
  // A post in flight owns the screen: an action behind its dialog (a card
  // reached by keyboard, say) would open another dialog over a compose one
  // that cannot close, and leave it stranded.
  if (postingHost && !postingHost.contains(e.target)) return;
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case "open":    window.openDetail(id); break;
    case "approve": window.approveAnn(id); break;
    case "delete":  window.deleteAnn(id); break;
    case "ack":     window.acknowledgeAnn(id); break;
    case "acklist": window.loadAckList(id); break;
    case "drop-upload": dropUpload(id); break;
    case "share": {
      const ann = announcements.find(a => a.id === id);
      if (ann) shareUi.open({ id: ann.id, title: ann.title });
      break;
    }
  }
});

// ── Notifications & Events ────────────────────────────────────────────────────

// `emailBody` both requests the email channel and carries the full announcement
// text — `body` stays a short preview because it feeds a push notification,
// where anything longer is truncated by the OS anyway. The hub owns every gate
// that matters (email capability, per-member opt-out, monthly quota) and
// reports what it did in `email`; the request never fails just because mail
// didn't go out, so push is unaffected either way.
// `audience` is "all" or an explicit member-id list (logic.js notifyAudience);
// null means the announcement names nobody who can be told, so nothing is sent
// and the page says so rather than falling back to everyone.
async function notify(title, body, emailBody = null, audience = "all", done = "posted", audienceKind = "everyone") {
  if (audience === null) { toast(`Announcement ${done}, but nobody was told: nobody in its audience can be notified.`); return; }
  const res = await fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title, body, url: `/run/${APP_ID}`, source_app_id: APP_ID, audience,
      ...(emailBody ? { channels: ["push", "email"], email_body: emailBody } : {}),
    }),
  }).catch(() => null);
  // A 503 means push was delivered nowhere, but email fans out independently and
  // its outcome still rides in the body — so read it on any response we got.
  const alsoEmail = !!emailBody;
  if (!alsoEmail || !res) return;
  const email = await res.json().then(d => d?.email).catch(() => null);
  const line = emailOutcomeLine(email, { done, audienceKind: audienceKind ?? "everyone" });
  if (line) toast(line);
}

let toastTimer = null;
function toast(message) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  el.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 5000);
}

async function publishEvent(type, subjectId, payload = {}) {
  await fetch(EVENTS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_app_id: APP_ID, type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

// ── Demo data ─────────────────────────────────────────────────────────────────

  ];

// ── Deep link ─────────────────────────────────────────────────────────────────

function handleDeepLink() {
  const announcementId = new URLSearchParams(window.location.search).get("announcementId");
  if (!announcementId) return;
  const ann = announcements.find(a => a.id === announcementId);
  if (ann) window.openDetail(announcementId);
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  if (!DB) {
    await loadMembers();
    loadDemoData();
    render();
    handleDeepLink();
    return;
  }

  try {
    await Promise.all([loadMembers(), loadSettings()]);
    await Promise.all([loadAnnouncements(), loadAcknowledgements()]);
    loadFailed = false;
  } catch {
    loadFailed = true;
  }
  // Show settings gear for hub admins
  const settingsBtn = document.getElementById("settings-btn");
  if (settingsBtn && hubAdmin) settingsBtn.style.display = "";
  render();
  handleDeepLink();
}

document.addEventListener("click", (e) => {
  if (e.target.closest('[data-testid="load-retry"]')) init();
});

init();
</script>
